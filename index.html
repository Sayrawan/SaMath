<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100e18" />
    <meta name="description" content="مساحة خاصة لسارة" />
    <meta property="og:title" content="SaMath" />
    <meta property="og:description" content="مساحة خاصة لسارة" />
    <meta name="twitter:title" content="SaMath" />
    <meta name="twitter:description" content="مساحة خاصة لسارة" />
    <title>SaMath</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <noscript>تحتاج هذه المساحة إلى JavaScript حتى تعمل الأسئلة.</noscript>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <main id="app" class="app-shell">
      <section id="home-screen" class="screen home-screen is-active" aria-labelledby="welcome-title">
        <header class="home-topbar">
          <div class="brand-mark" aria-hidden="true">∫</div>
          <button class="icon-button" id="open-settings" type="button" aria-label="الإعدادات">⋯</button>
        </header>

        <div class="welcome-block">
          <p class="eyebrow">مساحتك الهادية</p>
          <h1 id="welcome-title">هلا سارة <span aria-hidden="true">🤍</span></h1>
          <p id="welcome-message">وش ودك تتدربين عليه اليوم؟ خذيها على راحتك.</p>
        </div>

        <div class="topic-picker">
          <label for="topic-select">الموضوع</label>
            <select id="topic-select">
              <option value="section45" selected>Section 4.5 · تدريب شامل</option>
              <option value="concepts">فهم القاعدة والصور غير المعيّنة</option>
              <option value="quotients">صور 0/0 و ∞/∞</option>
              <option value="transformations">التحويلات 0·∞ و ∞−∞</option>
              <option value="powers">القوى غير المعيّنة</option>
            </select>
        </div>

        <div class="mode-grid" aria-label="اختيار وضع الجلسة">
          <button class="mode-card mode-card-primary" id="start-training" type="button">
            <span class="mode-icon" aria-hidden="true">✦</span>
            <span class="mode-copy">
              <strong>وضع التدريب</strong>
              <small>حل بهدوء، تلميحات ومحاولات مفتوحة</small>
            </span>
            <span class="mode-arrow" aria-hidden="true">←</span>
          </button>

          <button class="mode-card" id="start-exam" type="button">
            <span class="mode-icon" aria-hidden="true">⌁</span>
            <span class="mode-copy">
              <strong>وضع الاختبار</strong>
              <small>إجاباتك تبقى خاصة إلى أن تنهين الجلسة</small>
            </span>
            <span class="mode-arrow" aria-hidden="true">←</span>
          </button>
        </div>

        <button class="resume-card is-hidden" id="resume-session" type="button">
          <span>
            <small>عندك جلسة محفوظة</small>
            <strong>كمّلي من مكانك</strong>
          </span>
          <span aria-hidden="true">←</span>
        </button>
      </section>

      <section id="quiz-screen" class="screen quiz-screen" aria-labelledby="question-title" hidden></section>
      <section id="results-screen" class="screen results-screen" aria-labelledby="results-title" hidden></section>
    </main>

    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <dialog id="app-dialog" class="app-dialog">
      <div id="dialog-content"></div>
    </dialog>

    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
